<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>151 Sealed · Live Prices</title>
<style>
  :root{
    --bg:#08090c; --panel:rgba(255,255,255,.025); --panel2:rgba(255,255,255,.04);
    --bd:rgba(255,255,255,.09); --tx:#e9ebef; --mut:#8b909a; --dim:#5c616b;
    --teal:#5eead4; --violet:#a78bfa; --green:#4ade80; --red:#f87171; --amber:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0e1220 0,#08090c 60%);
    color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    -webkit-font-smoothing:antialiased;padding:0 18px 80px}
  .wrap{max-width:760px;margin:0 auto}
  header{padding:38px 2px 22px}
  h1{margin:0;font-size:23px;letter-spacing:-.02em;font-weight:650}
  h1 .g{background:linear-gradient(90deg,var(--teal),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--mut);font-size:13px;margin-top:6px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:16px;padding:20px 20px 8px;margin:14px 0;
    backdrop-filter:blur(6px)}
  .chead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .pname{font-size:17px;font-weight:620;letter-spacing:-.01em}
  .chip{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
    border:1px solid var(--bd);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .markrow{display:flex;align-items:flex-end;gap:16px;margin:14px 0 4px;flex-wrap:wrap}
  .mark{font-size:38px;font-weight:680;letter-spacing:-.03em;line-height:1}
  .mark .c{color:var(--dim);font-weight:500;font-size:24px}
  .markmeta{font-size:12px;color:var(--mut);padding-bottom:4px}
  .markmeta b{color:var(--teal);font-weight:600}
  .basis-tcg b{color:var(--amber)}
  .bracket{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:12.5px;color:var(--mut)}
  .bbar{flex:1;height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(96,165,250,.25),rgba(94,234,212,.5),rgba(167,139,250,.3));position:relative}
  .bdot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(94,234,212,.25)}
  .bval{color:var(--tx);font-weight:600}
  table{width:100%;border-collapse:collapse;margin:10px 0 6px;font-size:13px}
  th{text-align:right;color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:6px 6px}
  th:first-child{text-align:left}
  td{padding:8px 6px;border-top:1px solid rgba(255,255,255,.05);text-align:right;color:var(--tx)}
  td:first-child{text-align:left;color:var(--mut)}
  .ven{display:inline-flex;align-items:center;gap:7px;color:var(--tx);font-weight:550}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .na{color:var(--dim)}
  .bid{color:var(--green)} .ask{color:var(--tx)} .note{color:var(--mut);font-size:11.5px}
  .foot{color:var(--dim);font-size:11.5px;margin-top:20px;text-align:center;line-height:1.7}
  .refresh{color:var(--mut);font-size:12px;cursor:pointer;border:1px solid var(--bd);border-radius:8px;padding:5px 11px;background:none;font-family:inherit}
  .refresh:hover{color:var(--tx);border-color:var(--mut)}
  .toprow{display:flex;justify-content:space-between;align-items:center}
  .loading{color:var(--mut);text-align:center;padding:60px 0}
  .aucwrap{margin:8px 0 14px;border-top:1px solid rgba(255,255,255,.05);padding-top:12px}
  .auchead{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
  .auc{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--tx)}
  .auc:hover{background:var(--panel2)}
  .cd{min-width:64px;font-size:12px;color:var(--amber);font-variant-numeric:tabular-nums}
  .cd.soon{color:var(--red)} .cd.ended{color:var(--dim)}
  .abid{min-width:50px;font-weight:650;font-size:13px}
  .abc{min-width:56px;color:var(--green);font-size:12px}
  .atitle{color:var(--mut);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
  .aucbid{color:var(--green)}
  .tapewrap{margin:10px 0 4px;border-top:1px solid rgba(255,255,255,.05);padding-top:11px}
  .tapehead{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
  .tapesrc{text-transform:none;letter-spacing:0;color:var(--dim);font-size:10.5px}
  .tape{display:flex;flex-wrap:wrap;gap:6px}
  .sale{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--tx);border:1px solid transparent;font-variant-numeric:tabular-nums}
  .sale.ebay{color:var(--green)}
  .sale.last{border-color:var(--teal)}
  .sale.ebay.last{border-color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="toprow">
      <div>
        <h1>151 Sealed · <span class="g">Live Prices</span></h1>
        <div class="sub">Settlement mark from cleaned completed sales · bid/ask + live auctions across venues</div>
      </div>
      <button class="refresh" onclick="load()">↻ refresh</button>
    </div>
  </header>
  <div id="app"><div class="loading">loading prices…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const URL='https://nzxewmwznmrvwgiptdjs.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56eGV3bXd6bm1ydndnaXB0ZGpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjI5NTEsImV4cCI6MjA5NjEzODk1MX0.Zx1b2qpuHDIJRGF3UbiLbCN7bvsI3luRt6Puy4qmF1s';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const VEN={ebay:{n:'eBay',c:'#5eead4'},tcgplayer:{n:'TCGplayer',c:'#60a5fa'},amazon:{n:'Amazon',c:'#fbbf24'},stockx:{n:'StockX',c:'#4ade80'},cardmarket:{n:'Cardmarket 🇪🇺',c:'#a78bfa'}};
const fx=1.08; // EUR->USD rough
const money=(v,cur)=> (cur==='EUR'?'€':'$')+Number(v).toLocaleString(undefined,{maximumFractionDigits: v<50?2:0});

async function get(t){const r=await fetch(`${URL}/rest/v1/${t}?select=*`,{headers:H});return r.ok?r.json():[]}

function auctionBlock(list){
  if(!list||!list.length) return '';
  const bidding=list.filter(a=>+a.bid_count>0).length;
  const rows=list.slice(0,6).map(a=>{
    const cur=(a.currency==='EUR'?'€':'$')+Math.round(+a.current_bid);
    const bc=+a.bid_count;
    return `<a class="auc" href="${a.url||'#'}" target="_blank" rel="noopener">
      <span class="cd" data-end="${a.end_time}">·</span>
      <span class="abid mono">${cur}</span>
      <span class="abc">${bc} bid${bc===1?'':'s'}</span>
      <span class="atitle">${(a.title||'').replace(/[<>]/g,'').slice(0,46)}</span></a>`;
  }).join('');
  return `<div class="aucwrap"><div class="auchead">🔨 ${list.length} live auctions · ${bidding} taking bids</div>${rows}</div>`;
}
function tick(){
  document.querySelectorAll('.cd').forEach(e=>{
    const d=new Date(e.dataset.end).getTime()-Date.now();
    if(isNaN(d)){e.textContent='';return;}
    if(d<=0){e.textContent='ending';e.className='cd ended';return;}
    const h=Math.floor(d/3.6e6),m=Math.floor(d%3.6e6/6e4),s=Math.floor(d%6e4/1e3);
    e.textContent=h>0?`${h}h ${m}m`:`${m}m ${s}s`;
    e.className='cd'+(d<36e5?' soon':'');
  });
}
setInterval(tick,1000);

function salesTape(list, mark){
  if(!list||!list.length) return '';
  const clean=list.filter(s=>+s.price>=mark*0.5 && +s.price<=mark*2).slice(0,10);
  if(!clean.length) return '';
  const chips=clean.map((s,i)=>`<span class="sale ${s.source}${i===0?' last':''}" title="${s.source==='ebay'?'eBay auction close':'TCGplayer sale'}">$${Math.round(+s.price)}</span>`).join('');
  return `<div class="tapewrap"><div class="tapehead">Recent sales <span class="tapesrc">· newest first · tcg + ebay closes</span></div><div class="tape">${chips}</div></div>`;
}

async function load(){
  const [marks,latest,aucts,sales]=await Promise.all([get('sealed_mark'),get('sealed_latest'),
    fetch(`${URL}/rest/v1/sealed_auctions?status=eq.active&order=end_time.asc&limit=300`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${URL}/rest/v1/sealed_sales?order=sold_at.desc&limit=400`,{headers:H}).then(r=>r.ok?r.json():[])]);
  // group latest by product -> venue -> {signal:row}
  const byP={};
  for(const r of latest){(byP[r.product_id]=byP[r.product_id]||{});
    (byP[r.product_id][r.venue]=byP[r.product_id][r.venue]||{})[r.signal_type]=r;}
  const byA={};
  for(const a of aucts){(byA[a.product]=byA[a.product]||[]).push(a);}
  const byS={};
  for(const s of sales){(byS[s.product_id]=byS[s.product_id]||[]).push(s);}
  if(!marks||!marks.length){ setTimeout(load,3000); return; }   // transient empty fetch -> retry, don't blank
  let html='';
  for(const m of marks){
    const P=byP[m.id]||{};
    const mark=+m.mark;
    const ebayBid=(byA[m.name]||[]).filter(a=>+a.bid_count>0).reduce((x,a)=>Math.max(x,+a.current_bid),0);
    const basisTxt = m.basis==='sales'
      ? `<b>${m.trades}</b> sales · ${m.n_sources} source${m.n_sources==1?'':'s'} · 30d $${m.lo30}–${m.hi30}`
      : `<span class="basis-tcg"><b>TCG market</b> · no clean sales feed yet</span>`;
    // venue rows
    let rows='';
    for(const key of ['ebay','tcgplayer','amazon','stockx','cardmarket']){
      const o=P[key]; if(!o)continue; const cur=(o.ask||o.bid||o.market||{}).currency||'USD';
      let bid=o.bid?money(o.bid.price,cur):'<span class="na">—</span>';
      if(key==='ebay'&&ebayBid>0) bid=`<span class="aucbid" title="highest live auction bid">🔨 ${money(ebayBid)}</span>`;
      const ask=o.ask?money(o.ask.price,cur):'<span class="na">—</span>';
      const mkt=o.market?money(o.market.price,cur):'<span class="na">—</span>';
      let note='';
      const raw=(o.ask||o.market||o.bid||{}).raw||{};
      if(key==='amazon'&&raw.monthlySold)note=`${raw.monthlySold}/mo sold`;
      else if(key==='ebay'&&raw.min)note=`floor $${Math.round(raw.min)} · ${o.ask?o.ask.n_listings:''} listed`;
      else if(cur==='EUR')note=`≈ $${Math.round((o.market?o.market.price:o.ask.price)*fx)}`;
      rows+=`<tr><td><span class="ven"><span class="dot" style="background:${VEN[key].c}"></span>${VEN[key].n}</span></td>
        <td class="bid">${bid}</td><td class="ask">${ask}</td><td>${mkt}</td><td class="note">${note}</td></tr>`;
    }
    html+=`<div class="card">
      <div class="chead"><div class="pname">${m.name}</div><div class="chip">${m.ptype.replace('_',' ')}</div></div>
      <div class="markrow">
        <div class="mark mono">$${mark.toLocaleString(undefined,{minimumFractionDigits:mark<50?2:0,maximumFractionDigits:mark<50?2:0})}</div>
        <div class="markmeta">MARK<br>${basisTxt}</div>
      </div>
      <table><thead><tr><th>Venue</th><th>Bid</th><th>Ask</th><th>Market</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      ${salesTape(byS[m.id], mark)}
      ${auctionBlock(byA[m.name])}
    </div>`;
  }
  document.getElementById('app').innerHTML=html; tick();
  document.getElementById('foot').innerHTML=`Mark = winsorized (p10–p90) median of completed sales (TCG + eBay closes) · asks/bids/auctions = context.<br>auto-refreshes · ${new Date().toLocaleString()}`;
}
load(); setInterval(load,60000);
</script>
</body>
</html>
