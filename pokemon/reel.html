<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOPS × Pokémon Oracles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100vh;
  background:#07080d;
  overflow:hidden;
  font-family:-apple-system,'Helvetica Neue',sans-serif;
  color:#fff;
  user-select:none;
  perspective:1400px;
  perspective-origin:50% 44%;
}

:root{
  --acc:255,106,61;
  --green:#a8ff3e;
}

/* ── background glow ── */
#glow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  transition:background 1s ease;
}
#glow::before{
  content:'';position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-54%);
  width:750px;height:750px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--acc),.14) 0%,transparent 65%);
  transition:background .9s ease;
}
#glow::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 46%,transparent 20%,rgba(0,0,0,.6) 100%);
}

/* ── card ── */
#card{
  position:fixed;
  left:50%;top:42%;
  transform:translate(-50%,-50%);
  width:min(320px,46vw,36vh);
  z-index:10;
  transform-origin:center center;
  will-change:transform,opacity;
}
#card img{
  width:100%;border-radius:13px;display:block;
  transition:box-shadow .8s ease;
}
#card .sheen{
  position:absolute;inset:0;border-radius:13px;
  background:linear-gradient(
    118deg,
    transparent 20%,
    rgba(255,255,255,.05) 32%,
    rgba(180,180,255,.1) 39%,
    rgba(255,180,200,.09) 47%,
    rgba(180,255,200,.07) 55%,
    rgba(255,255,255,.04) 63%,
    transparent 74%
  );
  background-size:240% 240%;
  animation:sheen 3.5s linear infinite;
  pointer-events:none;
}
@keyframes sheen{
  0%  {background-position:0% 0%}
  100%{background-position:200% 200%}
}

/* card states */
#card.entering{animation:cIn .88s cubic-bezier(.16,1,.3,1) forwards}
#card.floating {animation:cFloat 3.8s ease-in-out infinite}
#card.exiting  {animation:cOut .55s cubic-bezier(.6,0,.8,0) forwards}

@keyframes cIn{
  from{transform:translate(calc(-50% + 110vw),-50%) rotateY(-28deg) scale(.8);opacity:0}
  to  {transform:translate(-50%,-50%) rotateY(0deg) scale(1);opacity:1}
}
@keyframes cFloat{
  0%,100%{transform:translate(-50%,-50%) translateY(0px) rotateZ(-.5deg) rotateX(1.2deg)}
  50%    {transform:translate(-50%,-50%) translateY(-14px) rotateZ(.5deg) rotateX(-1.2deg)}
}
@keyframes cOut{
  to{transform:translate(calc(-50% - 110vw),-50%) rotateY(28deg) scale(.8);opacity:0}
}

/* ── text ── */
#txt{
  position:fixed;
  bottom:max(15vh,76px);
  left:0;right:0;
  text-align:center;
  pointer-events:none;
  z-index:10;
}
.tn{
  font-size:clamp(.8rem,2vw,1.25rem);
  font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.6);
  opacity:0;transform:translateY(18px);
  transition:opacity .45s ease .4s,transform .5s cubic-bezier(.16,1,.3,1) .4s;
}
.tp{
  font-size:clamp(2.8rem,7vw,5rem);
  font-weight:800;letter-spacing:-.02em;
  color:var(--green);
  font-variant-numeric:tabular-nums;
  line-height:1.05;margin-top:.1em;
  opacity:0;transform:translateY(18px);
  transition:opacity .45s ease .55s,transform .5s cubic-bezier(.16,1,.3,1) .55s;
}
.tl{
  font-size:clamp(.55rem,1.05vw,.78rem);
  letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.27);
  margin-top:.55em;
  opacity:0;transform:translateY(12px);
  transition:opacity .45s ease .7s,transform .45s cubic-bezier(.16,1,.3,1) .7s;
}
#txt.on .tn,#txt.on .tp,#txt.on .tl{opacity:1;transform:none}

/* ── progress bar ── */
#bar{
  position:fixed;top:0;left:0;
  height:2px;width:0%;
  background:var(--green);
  z-index:40;
}

/* ── dots ── */
#dots{
  position:fixed;bottom:max(4.5vh,28px);
  left:0;right:0;
  display:flex;justify-content:center;gap:10px;
  z-index:10;
}
.dot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.18);
  transition:all .35s ease;
}
.dot.on{
  background:var(--green);
  border-radius:3px;
  transform:scaleX(2.6);
}

/* ── nav ── */
.brand{
  position:fixed;top:24px;left:30px;
  display:flex;align-items:center;gap:9px;
  text-decoration:none;z-index:20;
}
.brand img{height:25px}
.brand-t{
  font-size:.72rem;letter-spacing:.14em;
  color:rgba(255,255,255,.32);
}
.brand-t b{color:var(--green)}

.back{
  position:fixed;top:24px;right:30px;
  text-decoration:none;
  font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.2);z-index:20;
  transition:color .2s;
}
.back:hover{color:var(--green)}
</style>
</head>
<body>

<div id="glow"></div>

<a class="brand" href="/pokemon/">
  <img src="../logo.svg" alt="KOPS">
  <span class="brand-t"><b>KOPS</b> × POKEMON ORACLES</span>
</a>
<a class="back" href="/pokemon/">← All Indexes</a>

<div id="bar"></div>
<div id="card"></div>

<div id="txt">
  <div class="tn" id="tn"></div>
  <div class="tp" id="tp"></div>
  <div class="tl" id="tl"></div>
</div>

<div id="dots"></div>

<script>
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56eGV3bXd6bm1ydndnaXB0ZGpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjI5NTEsImV4cCI6MjA5NjEzODk1MX0.Zx1b2qpuHDIJRGF3UbiLbCN7bvsI3luRt6Puy4qmF1s';
const REST='https://nzxewmwznmrvwgiptdjs.supabase.co/rest/v1';

const REEL=[
  {id:'META-VINTAGE-BASE-PSA9',label:'Vintage Base PSA 9',   line:'All 16 Base Set holos. One basket.',        img:'base1/4',         rgb:'255,106,61' },
  {id:'SWSH-BLUECHIP',         label:'SWSH Bluechip',        line:'The cards that defined modern collecting.', img:'swsh7/215',        rgb:'111,92,255' },
  {id:'EEVEE-PSA10',           label:'Cult of Eevee PSA 10', line:'The most loved Pokémon on the planet.',    img:'sv8pt5/167',       rgb:'240,160,80' },
  {id:'PRISMATIC-VOLW',        label:'Prismatic Evolutions', line:'The hottest set in the game right now.',   img:'sv8pt5/161',       rgb:'140,120,255'},
  {id:'VAN-GOGH-PROMO',        label:'Van Gogh Promo',       line:'Where art meets rarity.',                  img:'svp/85',           rgb:'255,210,63' },
  {id:'SET-151',               label:'Set 151',              line:'The original 151, reimagined.',            img:'sv3pt5/199',       rgb:'255,106,61' },
  {id:'EVS-CORE',              label:'Evolving Skies',       line:"Every collector's first grail set.",       img:'swsh7/218',        rgb:'63,224,197' },
  {id:'CROWNZENITH-CORE',      label:'Crown Zenith',         line:'Where the SWSH era peaked.',               img:'swsh12pt5gg/GG69', rgb:'176,107,255'},
];

// preload all images
const cache={};
REEL.forEach(r=>{
  const im=new Image();im.crossOrigin='anonymous';
  im.src=`https://wsrv.nl/?url=images.pokemontcg.io/${r.img}_hires.png&w=620&output=webp&q=78&maxage=31d`;
  cache[r.id]=im;
});

const prices={};
(async()=>{
  try{
    const ids=REEL.map(r=>`"${r.id}"`).join(',');
    const res=await fetch(
      `${REST}/index_table_mat?select=index_id,level_today&index_id=in.(${ids})`,
      {headers:{apikey:ANON,Authorization:`Bearer ${ANON}`}}
    );
    const rows=await res.json();
    if(Array.isArray(rows))rows.forEach(r=>prices[r.index_id]=r.level_today);
  }catch(e){}
})();

const cardEl=document.getElementById('card');
const glowEl=document.getElementById('glow');
const txtEl =document.getElementById('txt');
const tnEl  =document.getElementById('tn');
const tpEl  =document.getElementById('tp');
const tlEl  =document.getElementById('tl');
const barEl =document.getElementById('bar');
const dotsEl=document.getElementById('dots');

// build dots
REEL.forEach((_,i)=>{
  const d=document.createElement('div');
  d.className='dot'+(i===0?' on':'');
  dotsEl.appendChild(d);
});

let cur=0,timer=null;
const DUR=4600;

function setAcc(rgb){
  document.documentElement.style.setProperty('--acc',rgb);
}

function countUp(el,target,dur){
  const t0=performance.now();
  (function tick(now){
    const p=Math.min(1,(now-t0)/dur);
    const v=Math.round((1-Math.pow(1-p,3))*target);
    el.textContent='$'+v.toLocaleString();
    if(p<1)requestAnimationFrame(tick);
  })(t0);
}

function startBar(){
  barEl.style.transition='none';
  barEl.style.width='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    barEl.style.transition=`width ${DUR}ms linear`;
    barEl.style.width='100%';
  }));
}

function show(idx){
  const r=REEL[idx];
  setAcc(r.rgb);

  // card
  cardEl.innerHTML='';
  const img=new Image();
  img.crossOrigin='anonymous';
  img.src=cache[r.id].src;
  img.style.cssText=`width:100%;border-radius:13px;display:block;
    box-shadow:0 50px 100px rgba(0,0,0,.85),0 0 75px rgba(${r.rgb},.3),0 0 180px rgba(${r.rgb},.1)`;
  const sheen=document.createElement('div');
  sheen.className='sheen';
  cardEl.appendChild(img);
  cardEl.appendChild(sheen);
  cardEl.className='entering';
  setTimeout(()=>{cardEl.className='floating'},870);

  // text
  txtEl.classList.remove('on');
  tnEl.textContent=r.label;
  tpEl.textContent='$—';
  tlEl.textContent=r.line;
  setTimeout(()=>{
    txtEl.classList.add('on');
    const px=prices[r.id];
    if(px&&px>0)countUp(tpEl,Math.round(px),850);
    else tpEl.textContent='—';
  },480);

  // dots
  Array.from(dotsEl.children).forEach((d,i)=>{
    d.className='dot'+(i===idx?' on':'');
  });

  startBar();
}

function next(){
  txtEl.classList.remove('on');
  cardEl.className='exiting';
  clearTimeout(timer);timer=null;
  setTimeout(()=>{
    cur=(cur+1)%REEL.length;
    show(cur);
    schedule();
  },530);
}

function schedule(){
  clearTimeout(timer);
  timer=setTimeout(next,DUR);
}

// click anywhere to advance (except nav links)
document.addEventListener('pointerup',e=>{
  if(e.target.closest('a'))return;
  clearTimeout(timer);
  next();
});

// keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();clearTimeout(timer);next();}
  if(e.key==='ArrowLeft'){
    e.preventDefault();
    clearTimeout(timer);
    txtEl.classList.remove('on');
    cardEl.className='exiting';
    setTimeout(()=>{cur=(cur-1+REEL.length)%REEL.length;show(cur);schedule();},530);
  }
});

show(0);
schedule();
</script>
</body>
</html>
